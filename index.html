    <script id="mghub-persistence-vault-guard">
      // ManagementHub Enterprise Multi-Tier Persistence & Restaurant Customization Suite
      (function() {
        // Pre-hydration helper: populate initial localStorage if server has data and user is not in clean zero state
        try {
          var isZero = localStorage.getItem('bitehub_zero_state') === 'true';
          var currentRests = localStorage.getItem('bitehub_pkr_restaurants_v2');
          if (!isZero && (!currentRests || currentRests === 'null')) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/sync/state', false);
            xhr.send(null);
            if (xhr.status === 200) {
              var sJson = JSON.parse(xhr.responseText);
              if (sJson && sJson.data) {
                if (Array.isArray(sJson.data.restaurants)) {
                  localStorage.setItem('bitehub_pkr_restaurants_v2', JSON.stringify(sJson.data.restaurants));
                }
                if (Array.isArray(sJson.data.menuItems)) {
                  localStorage.setItem('bitehub_pkr_items_v2', JSON.stringify(sJson.data.menuItems));
                }
                if (Array.isArray(sJson.data.orders)) {
                  localStorage.setItem('bitehub_pkr_orders_v2', JSON.stringify(sJson.data.orders));
                }
                if (sJson.data.branding) {
                  localStorage.setItem('bitehub_app_branding_v3', JSON.stringify(sJson.data.branding));
                }
              }
            }
          }
        } catch(e) {}

        // Dynamic White-Label Brand Masking for Restaurant Direct Link (Removes all generic platform branding)
        try {
          var p = new URLSearchParams(window.location.search);
          var storeSlug = p.get('store') || p.get('r') || p.get('restaurant') ||
            (window.location.hash.includes('store=') ? window.location.hash.split('store=')[1].split('&')[0] : null) ||
            (window.location.pathname.startsWith('/store/') ? window.location.pathname.replace('/store/', '').split('/')[0] : null);

          if (storeSlug) {
            var rawRests = localStorage.getItem('bitehub_pkr_restaurants_v2');
            if (rawRests) {
              var parsedRests = JSON.parse(rawRests);
              var matched = parsedRests.find(function(r) {
                return (r.slug && r.slug.toLowerCase() === storeSlug.toLowerCase()) || (r.id && r.id.toLowerCase() === storeSlug.toLowerCase());
              });
              if (matched) {
                document.title = matched.name + ' - Official Storefront';
                if (matched.logoUrl) {
                  var iconEl = document.querySelector("link[rel*='icon']");
                  if (iconEl) iconEl.href = matched.logoUrl;
                }
                var appTitleMeta = document.querySelector("meta[name='apple-mobile-web-app-title']");
                if (appTitleMeta) appTitleMeta.setAttribute('content', matched.name);
              }
            }
          }
        } catch(e) {}

        const VAULT_KEY = 'bitehub_permanent_vault_v2';
        const STORAGE_KEYS = [
          'bitehub_pkr_restaurants_v2',
          'bitehub_pkr_items_v2',
          'bitehub_pkr_orders_v2',
          'bitehub_superadmin_creds_v2',
          'bitehub_customers_v3',
          'bitehub_subscription_plans_v2',
          'bitehub_plan_payments_v2',
          'bitehub_app_branding_v3',
          'bitehub_daily_special_offers_v2',
          'bitehub_restaurant_tables_v1',
          'bitehub_loyalty_config_v2'
        ];

        // 1. Permanent IndexedDB Engine
        const DB_NAME = 'ManagementHubPermanentDB';
        const DB_STORE = 'vault_store';
        let idb = null;

        function initIDB() {
          return new Promise(function(resolve) {
            try {
              const req = indexedDB.open(DB_NAME, 1);
              req.onupgradeneeded = function(e) {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_STORE)) {
                  db.createObjectStore(DB_STORE);
                }
              };
              req.onsuccess = function(e) {
                idb = e.target.result;
                resolve(idb);
              };
              req.onerror = function() { resolve(null); };
            } catch (err) {
              resolve(null);
            }
          });
        }

        async function saveIDB(key, val) {
          try {
            const db = idb || await initIDB();
            if (!db) return;
            const tx = db.transaction(DB_STORE, 'readwrite');
            if (val === null || val === undefined) {
              tx.objectStore(DB_STORE).delete(key);
            } else {
              tx.objectStore(DB_STORE).put(val, key);
            }
          } catch (e) {}
        }

        async function getIDB(key) {
          try {
            const db = idb || await initIDB();
            if (!db) return null;
            return new Promise(function(res) {
              const tx = db.transaction(DB_STORE, 'readonly');
              const req = tx.objectStore(DB_STORE).get(key);
              req.onsuccess = function() { res(req.result); };
              req.onerror = function() { res(null); };
            });
          } catch (e) { return null; }
        }

        // Global Vault Purge Helper: guarantees 100% clean wipe during reset without resurrection
        window.purgeVaultAndStorage = async function() {
          try {
            localStorage.setItem('bitehub_zero_state', 'true');
            localStorage.removeItem('bitehub_last_user_edit_ts');
            localStorage.removeItem(VAULT_KEY);
            for (const k of STORAGE_KEYS) {
              localStorage.removeItem(k);
            }
            await saveIDB('persistent_vault_snapshot', null);
            console.log('[SyncEngine] Vault and local storage completely purged.');
          } catch (err) {
            console.warn('[SyncEngine] Error purging vault:', err);
          }
        };

        async function backupToVault() {
          // If platform has been intentionally reset to clean zero state, do not re-populate vault
          if (localStorage.getItem('bitehub_zero_state') === 'true') {
            return;
          }
          try {
            const vault = {};
            for (const k of STORAGE_KEYS) {
              const val = localStorage.getItem(k);
              if (val) {
                try { vault[k] = JSON.parse(val); } catch { vault[k] = val; }
              }
            }
            if (Object.keys(vault).length > 0) {
              localStorage.setItem(VAULT_KEY, JSON.stringify(vault));
              await saveIDB('persistent_vault_snapshot', vault);
            }
          } catch (e) {
            console.warn('[Vault] Backup error:', e);
          }
        }

        // Listen for reset events from SSE or tabs
        window.addEventListener('storage', function(e) {
          if (e.key === 'bitehub_zero_state' && e.newValue === 'true') {
            window.purgeVaultAndStorage();
          }
        });

        // 3. Dynamic Restaurant PWA Manifest & App Downloader (Task 3)
        function checkAndApplyRestaurantPWA() {
          try {
            const params = new URLSearchParams(window.location.search);
            const storeParam = params.get('store') || params.get('restaurant') || params.get('r') || '';
            const restsRaw = localStorage.getItem('bitehub_pkr_restaurants_v2');
            if (!restsRaw) return;
            const rests = JSON.parse(restsRaw);
            if (!Array.isArray(rests) || rests.length === 0) return;

            let targetRest = null;
            if (storeParam) {
              const cleanParam = storeParam.replace(/-+$/, '').toLowerCase();
              targetRest = rests.find(r => (r.slug && r.slug.replace(/-+$/, '').toLowerCase() === cleanParam) || r.id.toLowerCase() === cleanParam || (r.name && r.name.toLowerCase() === cleanParam));
            }
            if (!targetRest) {
              const path = window.location.pathname;
              if (path.startsWith('/store/')) {
                const pSlug = path.replace('/store/', '').split('/')[0].replace(/-+$/, '').toLowerCase();
                targetRest = rests.find(r => (r.slug && r.slug.replace(/-+$/, '').toLowerCase() === pSlug) || r.id.toLowerCase() === pSlug);
              }
            }
            if (!targetRest) {
              // Check if hostname matches any restaurant customDomain
              const host = window.location.hostname.toLowerCase();
              if (!host.includes('run.app') && !host.includes('localhost') && !host.includes('127.0.0.1')) {
                targetRest = rests.find(r => r.customDomain && (r.customDomain.toLowerCase().includes(host) || host.includes((r.slug || '').toLowerCase())));
              }
            }

            // Super Admin Logo Retrieval Helper
            const adminLogo = getSuperAdminLogo();

            if (targetRest) {
              const rName = targetRest.name || 'Restaurant';
              const rLogo = targetRest.logoUrl || adminLogo;
              const rColor = targetRest.primaryColor || '#f97316';
              const storeUrl = formatDirectStoreUrl(targetRest);

              // Set Favicon to this restaurant's own logo
              let favIcon = document.querySelector('link[rel="icon"]');
              if (favIcon && favIcon.href !== rLogo) favIcon.href = rLogo;
              let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
              if (appleIcon && appleIcon.href !== rLogo) appleIcon.href = rLogo;

              // Update Mobile App Title for target restaurant
              document.title = `${rName} - Official Food Ordering`;
              let appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
              if (appleTitle) appleTitle.content = rName;

              let themeMeta = document.querySelector('meta[name="theme-color"]');
              if (themeMeta) themeMeta.content = rColor;

              // Apply this restaurant's chosen dish picture shape (Square, Landscape, Reel, Natural, Circle)
              const savedMode = localStorage.getItem('bitehub_dish_image_mode_' + targetRest.id);
              const rMode = targetRest.imageOrientation || savedMode || 'square';
              if (document.documentElement.getAttribute('data-dish-image-mode') !== rMode) {
                document.documentElement.setAttribute('data-dish-image-mode', rMode);
              }

              // Generate Dynamic W3C Manifest Blob with Restaurant Name and Logo
              const manifestData = {
                name: `${rName} App`,
                short_name: rName.length > 12 ? rName.substring(0, 12) : rName,
                description: targetRest.tagline || `Order food directly from ${rName}`,
                start_url: window.location.origin + '/?store=' + encodeURIComponent(targetRest.slug || targetRest.id),
                display: "standalone",
                background_color: "#0f172a",
                theme_color: rColor,
                scope: "/",
                id: window.location.origin + '/?store=' + encodeURIComponent(targetRest.slug || targetRest.id),
                icons: [
                  { src: rLogo, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                  { src: rLogo, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                ]
              };

              const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
              const blobUrl = URL.createObjectURL(blob);
              let manifestLink = document.querySelector('link[rel="manifest"]');
              if (manifestLink) manifestLink.href = blobUrl;
            } else {
              document.title = "ManagementHub Enterprise Food Cloud Suite";
              let favIcon = document.querySelector('link[rel="icon"]');
              if (favIcon && favIcon.href !== adminLogo) favIcon.href = adminLogo;
              let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
              if (appleIcon && appleIcon.href !== adminLogo) appleIcon.href = adminLogo;
            }
          } catch (e) {
            console.warn('[PWA] Manifest error:', e);
          }
        }

        // Helper to retrieve the Super Admin's logo
        function getSuperAdminLogo() {
          try {
            const brandingRaw = localStorage.getItem('bitehub_app_branding_v3');
            if (brandingRaw) {

    <script>
      // Safe toast notification replacement for window.alert to prevent iframe freeze
      window.alert = function(msg) {
        if (!msg) return;
        console.warn('[Notice]', msg);
        let toast = document.getElementById('global-safe-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'global-safe-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999999;background:#0f172a;border:1px solid #f97316;color:#f8fafc;padding:12px 22px;border-radius:12px;font-family:sans-serif;font-size:13px;font-weight:600;box-shadow:0 12px 35px rgba(0,0,0,0.6);display:flex;align-items:center;gap:10px;pointer-events:none;transition:all 0.25s ease;';
          document.body.appendChild(toast);
        }
        toast.innerHTML = '<span>🔔</span> <span>' + String(msg) + '</span>';
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function() {
          if (toast) {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(12px)';
          }
        }, 4000);
      };

          target.dataset.fallbackApplied = 'true';
          target.src = 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=800&q=80';
